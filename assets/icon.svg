    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <path id="face" d="M150 205 C148 268 168 318 208 350 Q238 374 256 376 Q274 374 304 350 C344 318 364 268 362 205 Z"/>
    <clipPath id="faceClip"><use xlink:href="#face"/></clipPath>
