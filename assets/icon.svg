    <use xlink:href="#bangs" fill="url(#hair)"/>
    <g fill="none" stroke="#2A56B0" stroke-width="2" stroke-linecap="round" opacity="0.35">
      <path d="M206 200 Q214 160 236 128"/><path d="M246 198 Q250 160 258 126"/>
      <path d="M280 198 Q280 160 286 128"/><path d="M318 202 Q312 166 300 134"/>
      <path d="M170 206 Q182 170 200 144"/><path d="M352 206 Q342 172 322 146"/>
