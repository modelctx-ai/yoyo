    <path id="eyeShape" d="M-28 -12 Q-4 -30 26 -20 Q31 4 22 24 Q0 35 -22 24 Q-31 6 -28 -12 Z"/>
    <clipPath id="eyeClip"><use xlink:href="#eyeShape"/></clipPath>
    <g id="eye">
