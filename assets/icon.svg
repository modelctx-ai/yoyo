    <path d="M148 152 Q256 64 364 152 Q256 86 148 152 Z" fill="#2B3566"/>
    <path d="M144.0 150.0 Q131.7 142.2 147.3 136.1 Q138.3 126.9 156.8 123.0 Q151.3 112.6 172.2 111.5 Q170.2 99.8 192.4 102.3 Q194.4 89.2 216.3 95.8 Q223.4 81.5 242.5 92.4 Q256.0 78.4 269.5 92.4 Q288.6 81.5 295.7 95.8 Q317.6 89.2 319.6 102.3 Q341.8 99.8 339.8 111.5 Q360.7 112.6 355.2 123.0 Q373.7 126.9 364.7 136.1 Q380.3 142.2 368.0 150.0 L352.0 158.0 L349.2 147.5 L341.0 137.6 L327.9 128.8 L310.5 121.8 L290.0 116.9 L267.6 114.3 L244.4 114.3 L222.0 116.9 L201.5 121.8 L184.1 128.8 L171.0 137.6 L162.8 147.5 L160.0 158.0 Z" fill="#FFFFFF" stroke="#D6DEF3" stroke-width="2"/>
    <g transform="translate(342 118) rotate(28)">
      <path d="M0 0 Q-22 -18 -24 2 Q-22 20 0 4 Z" fill="#F0587F"/>
      <path d="M0 0 Q22 -18 24 2 Q22 20 0 4 Z" fill="#E24A73"/>
      <circle cx="0" cy="2" r="6" fill="#C2335C"/>
