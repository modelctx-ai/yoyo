      <g clip-path="url(#eyeClip)">
        <ellipse cx="2" cy="5" rx="21" ry="28" fill="url(#iris)"/>
        <ellipse cx="2" cy="3" rx="9" ry="13" fill="#0B1A45"/>
        <ellipse cx="2" cy="21" rx="14" ry="7" fill="#B6F3FF" opacity="0.75"/>
        <rect x="-32" y="-32" width="64" height="16" fill="#14286E" opacity="0.35"/>
      </g>
      <path d="M-35 -8 Q-8 -38 31 -22 Q34 -17 29 -14 Q-4 -29 -30 -4 Z" fill="#1E1A3A"/>
      <path d="M-31 -7 L-43 -17 L-35 -2 Z" fill="#1E1A3A"/>
      <path d="M-17 27 Q3 33 18 25" fill="none" stroke="#5B3A4A" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g id="eyeHi"><ellipse cx="-9" cy="-10" rx="7.5" ry="9.5"/><circle cx="10" cy="12" r="3.5"/><circle cx="-12" cy="14" r="2"/></g>
    <path id="sparkle" d="M0 -12 Q2 -2 12 0 Q2 2 0 12 Q-2 2 -12 0 Q-2 -2 0 -12 Z"/>
