    <path d="M262 440 L276 486 L264 482 L258 492 L254 446 Z" fill="#C2335C"/>
    <path d="M256 438 Q224 414 220 440 Q224 464 256 444 Z" fill="#F0587F"/>
    <path d="M256 438 Q288 414 292 440 Q288 464 256 444 Z" fill="#E24A73"/>
    <rect x="248" y="432" width="16" height="16" rx="5" fill="#C2335C"/>

