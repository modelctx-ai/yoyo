<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFF6FB"/>
      <stop offset="0.6" stop-color="#E3EEFF"/>
      <stop offset="1" stop-color="#B9D3FF"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E8EF0"/>
      <stop offset="0.55" stop-color="#3B6FD8"/>
      <stop offset="1" stop-color="#6FC2FF"/>
    </linearGradient>
    <linearGradient id="hairBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D57B8"/>
      <stop offset="1" stop-color="#4E9BF0"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14286E"/>
      <stop offset="0.5" stop-color="#2E6FE0"/>
      <stop offset="1" stop-color="#7FE3FF"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE4D6"/>
      <stop offset="1" stop-color="#FFEFE6"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3566"/>
      <stop offset="1" stop-color="#1C2247"/>
