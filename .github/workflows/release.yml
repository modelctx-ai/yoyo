name: Release

# 推 v* tag 时打 macOS 的 yoyo.app，做成拖动安装的 dmg，挂到这个 tag 的 Release（没有就建一个）。
# Apple 芯片（arm64）和 Intel（x86_64）各在自己的 runner 上打一个包；两个都打好才挂到 Release。
# 装好的 app 从 Release 的最新版本检查更新，按自己的架构挑 dmg 下载。
# 也能在 Actions 页手动跑：两个架构都只打包、上传成构建产物，不碰 Release。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ctx_ref:
        description: ctx 的分支、tag 或提交
        default: main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      # 一个架构失败，另一个照样跑完：看得到两边各自的问题
      fail-fast: false
      matrix:
        include:
          # Apple 芯片
          - arch: arm64
            runner: macos-15
          # Intel：GitHub 提供的 x64 runner
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: yoyo
    steps:
      - uses: actions/checkout@v4
        with:
          path: yoyo

      # ctx 还没发到 npm：和 CI 一样检出在 yoyo 旁边，overrides 里的 link:../ctx/packages/* 才找得到。
      # 桌宠不用检出：npm 上的 dsh-pet 跟着 yoyo 的锁文件装，补丁在 patches/
      - uses: actions/checkout@v4
        with:
          repository: modelctx-ai/ctx
          ref: ${{ inputs.ctx_ref || 'main' }}
          path: ctx

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: yoyo/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: |
            ctx/pnpm-lock.yaml
            yoyo/pnpm-lock.yaml

      - name: 版本号
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "tag $GITHUB_REF_NAME 和 package.json 的版本 $version 不一致，先改 package.json 再打 tag" >&2
              exit 1
            fi
          else
            version="$version-dev.$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Build ctx
        working-directory: ctx
        run: pnpm install --frozen-lockfile && pnpm build

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      # whisper-cli 和 ffmpeg 编一次要几分钟：按 tools.sh 的内容缓存
      - uses: actions/cache@v4
        with:
          path: yoyo/.cache/release-tools
          key: release-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yoyo/scripts/release/tools.sh') }}

      - name: 打包
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CTX_DIR: ${{ github.workspace }}/ctx
        run: scripts/release/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.dmg }}
            ${{ steps.package.outputs.sha }}
          retention-days: 7
          if-no-files-found: error

  # 两个架构的包都打好了才挂到 Release：分开挂会抢着建 Release，也可能只发出一个架构
  publish:
    name: 挂到 Release
    needs: macos
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: yoyo-*
          merge-multiple: true
          path: release

      - name: 挂到 Release
        run: |
          ls -l release
          # 缺一个架构就不发：app 内更新看到「没有 x86_64 的安装包」只会让人干等
          for arch in arm64 x86_64; do
            ls release/yoyo-*-macos-"$arch".dmg release/yoyo-*-macos-"$arch".dmg.sha256 >/dev/null
          done
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release/*.dmg release/*.dmg.sha256 --clobber
